apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: productcatalogservice
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/vuduccuong123/ecommerce-platform-lab.git
    targetRevision: main
    path: k8s/productcatalogservice

  destination:
    server: https://kubernetes.default.svc
    namespace: online-boutique

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
